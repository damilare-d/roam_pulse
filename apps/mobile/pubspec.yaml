name: roam_pulse
description: "RoamPulse — your connectivity, before you need to ask."
publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: ^3.9.0

resolution: workspace

dependencies:
  flutter:
    sdk: flutter
  cupertino_icons: ^1.0.8
  auto_route: ^9.2.2
  flutter_bloc: ^8.1.6
  provider: ^6.1.5
  dio: ^5.7.0
  connectivity:
    path: ../../packages/connectivity
  diagnostics:
    path: ../../packages/diagnostics
  core:
    path: ../../packages/core
  design_system:
    path: ../../packages/design_system
  network:
    path: ../../packages/network
  plans:
    path: ../../packages/plans
  storage:
    path: ../../packages/storage

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^5.0.0
  auto_route_generator: ^9.0.0
  build_runner: ^2.4.13

flutter:
  uses-material-design: true
