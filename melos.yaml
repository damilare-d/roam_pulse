name: roampulse

packages:
  - apps/**
  - packages/**

command:
  bootstrap:
    usePubspecOverrides: true

scripts:
  analyze:
    run: dart analyze --fatal-infos
    exec:
      concurrency: 1
    description: Run static analysis across every package.

  format:
    run: dart format --set-exit-if-changed .
    exec:
      concurrency: 1
    description: Check formatting across every package.

  test:
    run: flutter test
    exec:
      concurrency: 1
    description: Run unit/widget tests across every package.
