databases:
  - name: roampulse-db
    plan: free
    postgresMajorVersion: "16"

services:
  - type: web
    name: roampulse-api
    runtime: go
    plan: free
    rootDir: backend/api
    buildCommand: go build -o bin/api ./cmd/api
    startCommand: ./bin/api
    # Reseeds deterministic demo data on every deploy — desirable for a
    # public demo (every visitor sees the same pristine Tokyo/SoftBank
    # scenario, not whatever a previous visitor's diagnostic runs left
    # behind) since postgres.Seed truncates before inserting (see
    # backend/api/internal/postgres/seed.go) and is safe to rerun.
    preDeployCommand: go run ./cmd/seed
    envVars:
      - key: DATABASE_URL
        fromDatabase:
          name: roampulse-db
          property: connectionString
      - key: ANTHROPIC_API_KEY
        sync: false
