databases:
  - name: roampulse-db
    plan: free
    postgresMajorVersion: "16"

services:
  - type: web
    name: roampulse-api
    runtime: go
    plan: free
    rootDir: backend/api
    buildCommand: go build -o bin/api ./cmd/api
    startCommand: ./bin/api
    # No preDeployCommand — that's a paid-tier-only Render feature.
    # cmd/api itself reseeds deterministic demo data on every startup
    # (see cmd/api/main.go), which is what actually makes this work on
    # the free tier and is arguably better anyway: every visitor gets the
    # same pristine Tokyo/SoftBank scenario, not whatever a previous
    # visitor's diagnostic runs left behind.
    envVars:
      - key: DATABASE_URL
        fromDatabase:
          name: roampulse-db
          property: connectionString
      - key: ANTHROPIC_API_KEY
        sync: false
